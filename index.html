<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TBOS</title>
  <style id="webmakerstyle">
    /* General Reset */
    body,html {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      color: #000;
    }

    /* Startup Screen */
    #startup-screen {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
      color: #fff;
      z-index: 9999;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #startup-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    #startup-screen .startup-content {
      text-align: center;
      max-width: 90%;
      padding: 1rem;
    }

    #startup-screen img {
      display: block;
      max-width: 320px;
      width: 60vw;
      height: auto;
      margin: 0 auto 1rem;
    }

    #startup-screen .startup-text {
      font-size: 1.1rem;
      letter-spacing: 0.04em;
    }

    /* Hidden class */
    .hidden {
      display: none;
    }

    /* Cable Box Interface */
    #cable-interface {
      display: flex;
      height: 100vh;
    }

    /* Sidebar Section */
    #sidebar {
      width: 200px;
      background-color: #add8e6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
    }

    /* Logo */
    #logo-container {
      margin-bottom: 20px;
      width: 100%;
      text-align: center;
    }

    #logo {
      max-width: 80%;
      height: auto;
      border-radius: 5px;
    }

    /* Vertical Buttons */
    #button-panel {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .vertical-button {
      margin-bottom: 10px;
      padding: 10px;
      background-color: #4682b4;
      color: #fff;
      border: none;
      text-align: left;
      cursor: pointer;
      border-radius: 5px;
    }

    .vertical-button:hover {
      background-color: #5f9ea0;
    }

    /* Main Display Area */
    #main-display {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;
      padding: 20px;
      position: relative;
    }

    /* Black Box */
    #black-box {
      width: 100%;
      height: 200px;
      background-color: #000;
      color: #fff;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }

    #black-box h3 {
      margin: 0 0 10px 0;
      font-size: 18px;
    }

    /* Weather Widget */
    #weather-widget {
      background-color: #ffeb3b;
      color: #000;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      font-size: 14px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="startup-screen">
    <div class="startup-content">
      <img src="teleblue_logo.png" alt="TeleBlue Logo" onerror="this.style.display='none';" />
      <div class="startup-text">Starting TBOS...</div>
    </div>
  </div>

  <div id="cable-interface" class="hidden">
    <div id="sidebar">
      <div id="logo-container">
        <img id="logo" src="teleblue_logo.png" alt="TeleBlue Logo" />
      </div>
      <div id="button-panel">
        <button class="vertical-button" onclick="location.href='telebluerrors/protocol_error.html'">On Demand</button>
        <button class="vertical-button" onclick="location.href='telebluerrors/FSID.html'">Channel Guide</button>
        <button class="vertical-button" onclick="location.href='apps/calendar.html'">Calendar</button>
        <button class="vertical-button" onclick="location.href='telebluerrors/missingfile.html'">News</button>
        <button class="vertical-button" onclick="location.href='telebluerrors/missingfile.html'">Shop</button>
        <button class="vertical-button" onclick="location.href='apps/settings/settings.html'">Settings</button>
      </div>
    </div>

    <div id="main-display">
      <div id="black-box">
        <h3>Now Playing</h3>
        <p>Your live program preview will appear here.</p>
      </div>

      <div id="weather-widget">
        <h2>Weather</h2>
        <div id="weather-info">
          <p>Loading...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // JavaScript to handle startup and interface interactions
    document.addEventListener("DOMContentLoaded", () => {
      const startupScreen = document.getElementById("startup-screen");
      const cableInterface = document.getElementById("cable-interface");
      let startupTimeout = setTimeout(showInterface, 3000);

      startupScreen.addEventListener("click", () => {
        clearTimeout(startupTimeout);
        showInterface();
      });

      function showInterface() {
        if (startupScreen.classList.contains("hidden")) return;
        startupScreen.classList.add("hidden");
        cableInterface.classList.remove("hidden");
        fetchWeather("New York");
      }
    });

    async function fetchWeather(city) {
      const weatherInfo = document.getElementById("weather-info");
      try {
        const apiKey = "YOUR_API_KEY";
        const response = await fetch(
          `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`
        );
        if (!response.ok) throw new Error("Weather data not found");
        const data = await response.json();
        weatherInfo.innerHTML = `
          <p>${data.name}</p>
          <p>${data.weather[0].description}</p>
          <p>${data.main.temp} °C</p>
        `;
      } catch (error) {
        weatherInfo.innerHTML = `<p>Error: ${error.message}</p>`;
      }
    }
  </script>
</body>
</html>
